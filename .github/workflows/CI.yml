name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: cargo test --all-features
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: cratesio-auth
        if: ${{ github.event_name == 'push' }}
      - name: Publish crates
        if: ${{ github.event_name == 'push' }}
        run: |
          if ! git show --exit-code -G^version raffia_macro/Cargo.toml; then
            cargo publish -p raffia_macro
          fi
          if ! git show --exit-code -G^version raffia/Cargo.toml; then
            cargo publish -p raffia
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token }}

  playground:
    name: playground
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: wasm-pack
      - run: wasm-pack build --target web --no-typescript wasm
      - name: Deploy Production # zizmor: ignore[adhoc-packages]
        run: |
          npm i --location=global netlify-cli@27.5.0
          netlify deploy --site=3c60cb99-3e5c-4e0e-9f69-d1952439e0b5 --dir=wasm/pkg --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
